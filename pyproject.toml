[project]
name = "investigator"
version = "0.1.0"
description = "Multi-agent production incident investigation system"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.8",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=2.0"]
openai = ["langchain-openai>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["investigator", "reliability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["investigator", "reliability"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]
