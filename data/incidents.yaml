    tags: [tool_down, tool_partial]
    world:
      faults:
        - {tool: get_deployments, kind: timeout}
        - {tool: query_logs, kind: partial, max_rows: 2}
      logs:
        - {id: log-01, ts: 2026-03-17T08:06, service: payments, level: ERROR, msg: "internal server error request=77a1"}
        - {id: log-02, ts: 2026-03-17T08:07, service: payments, level: ERROR, msg: "internal server error request=77a2"}
        - {id: log-03, ts: 2026-03-17T08:08, service: payments, level: ERROR, msg: "internal server error request=77a3"}
      metrics:
        - {id: met-01, service: payments, metric: error_rate, region: us-east, start: 2026-03-17T07:55, step_min: 5, values: [0.002, 0.002, 0.15, 0.16, 0.16, 0.15]}
        - {id: met-02, service: postgres, metric: cpu, region: us-east, start: 2026-03-17T07:55, step_min: 5, values: [0.3, 0.31, 0.3, 0.31, 0.3, 0.3]}
        - {id: met-03, service: payvendor, metric: latency_p99_ms, region: external, start: 2026-03-17T07:55, step_min: 5, values: [290, 295, 300, 290, 295, 300]}
    truth: {outcome: inconclusive, category: unknown}

