        - {id: met-02, service: payvendor, metric: latency_p99_ms, region: external, start: 2026-03-15T11:55, step_min: 5, values: [290, 300, 4100, 9200, 9400, 9300]}
        - {id: met-03, service: payments, metric: latency_p99_ms, region: us-east, start: 2026-03-15T11:55, step_min: 5, values: [340, 350, 4200, 9300, 9500, 9400]}
