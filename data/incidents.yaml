  - incident:
      id: INC-07
      title: Checkout overloaded
      description: Checkout is rejecting requests during the spring sale.
      service: checkout
      reported_at: 2026-03-16T18:20
    scenario: Log tool times out twice, then recovers
    tags: [tool_timeout]
    world:
      faults:
        - {tool: query_logs, kind: timeout, times: 2}
      logs:
        - {id: log-01, ts: 2026-03-16T18:05, service: checkout, level: ERROR, msg: "request queue full, rejecting request depth=5000"}
      metrics:
        - {id: met-01, service: gateway, metric: requests_per_s, region: us-east, start: 2026-03-16T17:55, step_min: 5, values: [810, 820, 3900, 4300, 4400, 4350]}
        - {id: met-02, service: checkout, metric: cpu, region: us-east, start: 2026-03-16T17:55, step_min: 5, values: [0.41, 0.42, 0.97, 0.99, 0.99, 0.99]}
      deployments:
        - {id: dep-01, ts: 2026-03-14T10:00, service: checkout, kind: deploy, detail: "v5.2.0: minor UI fixes"}
