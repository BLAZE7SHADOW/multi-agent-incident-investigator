      reported_at: 2026-03-15T12:30
    scenario: Loud errors predate the incident; the real signal is quiet
    tags: [noisy_logs]
    split: holdout
    world:
      logs:
        - {id: log-01, ts: 2026-03-13T09:00, service: inventory, level: ERROR, msg: "stock sync failed for warehouse-7, will retry"}
        - {id: log-02, ts: 2026-03-14T09:00, service: inventory, level: ERROR, msg: "stock sync failed for warehouse-7, will retry"}
        - {id: log-03, ts: 2026-03-15T09:00, service: inventory, level: ERROR, msg: "stock sync failed for warehouse-7, will retry"}
        - {id: log-04, ts: 2026-03-15T12:00, service: inventory, level: ERROR, msg: "stock sync failed for warehouse-7, will retry"}
        - {id: log-05, ts: 2026-03-15T12:08, service: payments, level: WARN, msg: "payvendor responded after 9120ms"}
        - {id: log-06, ts: 2026-03-15T12:12, service: payments, level: WARN, msg: "payvendor responded after 9480ms"}
      metrics:
