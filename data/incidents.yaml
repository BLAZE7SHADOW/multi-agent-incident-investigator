        - {id: log-02, ts: 2026-03-21T15:30, service: payments, level: ERROR, msg: "database write failed: internal error from postgres"}
        - {id: log-03, ts: 2026-03-21T15:04, service: postgres, level: ERROR, msg: "could not extend file: no space left on device"}
      metrics:
        - {id: met-01, service: payments, metric: error_rate, region: us-east, start: 2026-03-21T15:00, step_min: 10, values: [0.003, 0.21, 0.22, 0.21, 0.22]}
